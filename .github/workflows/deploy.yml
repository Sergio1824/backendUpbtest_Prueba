name: Deploy a Render

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxis
        run: find src -name "*.js" -exec node --check {} \;

      - name: Desplegar en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::No está disponible el secreto RENDER_DEPLOY_HOOK_URL en el entorno dev."
            exit 1
          fi

          case "$RENDER_DEPLOY_HOOK_URL" in
            https://api.render.com/deploy/*) ;;
            *)
              echo "::error::RENDER_DEPLOY_HOOK_URL no parece ser un Deploy Hook de Render."
              exit 1
              ;;
          esac

          curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
